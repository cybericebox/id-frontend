apiVersion: v1
kind: ConfigMap
metadata:
  name: id-frontend-config
  namespace: cybericebox
data:
  # REQUIRED hosts (bare host, no scheme), copied from platform.env.
  MAIN_HOST: ""
  API_HOST: ""
  ID_HOST: ""
  ADMIN_HOST: ""
  EXERCISES_HOST: ""
  # REQUIRED: event sites are <tag>.<EVENT_DOMAIN>; the event domain.
  EVENT_DOMAIN: ""
  # REQUIRED: Domain attribute of the shared theme/consent cookies (e.g. cybericebox.com); no implicit parent.
  COOKIE_DOMAIN: ""
  # REQUIRED: support mailbox of the «Надіслати відгук» (send feedback) link on every page.
  SUPPORT_EMAIL: ""
  # REQUIRED partner links shown in the sign-in panel footer.
  PARTNER_ICE_NURE_URL: "https://ice.nure.ua/ua/"
  PARTNER_NURE_URL: "https://nure.ua"
  # REQUIRED: bot-check provider, one for the whole platform: turnstile | recaptcha | none (none = local development).
  # Must match the backend CAPTCHA_PROVIDER.
  CAPTCHA_PROVIDER: "none"
  # Public site key of the provider; REQUIRED when CAPTCHA_PROVIDER is not none (the container refuses to start without it).
  CAPTCHA_SITE_KEY: ""
  # Optional, recaptcha only: Google Cloud project id (not secret). Non-empty = reCAPTCHA Enterprise, empty = classic v3.
  RECAPTCHA_PROJECT: ""
  # Optional Google Analytics 4 measurement id (G-…). Empty → analytics off.
  GOOGLE_ANALYTICS_ID: ""
