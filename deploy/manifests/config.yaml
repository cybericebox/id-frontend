apiVersion: v1
kind: ConfigMap
metadata:
  name: id-frontend-config
  namespace: cybericebox
data:
  # REQUIRED hosts (bare host, no scheme), copied from platform.env.
  MAIN_HOST: ""
  API_HOST: ""
  ID_HOST: ""
  ADMIN_HOST: ""
  EXERCISES_HOST: ""
  # REQUIRED: event sites are <tag>.<EVENT_DOMAIN>; the event domain.
  EVENT_DOMAIN: ""
  # REQUIRED: Domain attribute of the shared theme/consent cookies (e.g. cybericebox.com); no implicit parent.
  COOKIE_DOMAIN: ""
  # REQUIRED partner links shown in the sign-in panel footer.
  PARTNER_URL: "https://ice.nure.ua/ua/"
  PARTNER_SITE_URL: "https://nure.ua"
  # REQUIRED: reCAPTCHA site key (public). The backend enforces reCAPTCHA, so an
  # empty or wrong key breaks sign-in; the container refuses to start without it.
  RECAPTCHA_SITE_KEY: ""
  # Must match the backend mode: "true" when RECAPTCHA_PROJECT (Enterprise) is set.
  RECAPTCHA_ENTERPRISE: "false"
  # Optional Google Analytics 4 measurement id (G-…). Empty → analytics off.
  GOOGLE_ANALYTICS_ID: ""
