apiVersion: apps/v1
kind: Deployment
metadata:
  name: id-frontend
  namespace: cybericebox
  labels:
    app: id-frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 3
      maxUnavailable: 0
  selector:
    matchLabels:
      app: id-frontend
  template:
    metadata:
      labels:
        app: id-frontend
    spec:
      containers:
        - name: id-frontend
          image: cybericebox/id-frontend:latest
          env:
            - name: NEXT_PUBLIC_MAIN_HOST
              valueFrom:
                configMapKeyRef:
                  name: id-frontend-config
                  key: MAIN_HOST
            - name: NEXT_PUBLIC_API_HOST
              valueFrom:
                configMapKeyRef:
                  name: id-frontend-config
                  key: API_HOST
            - name: NEXT_PUBLIC_ID_HOST
              valueFrom:
                configMapKeyRef:
                  name: id-frontend-config
                  key: ID_HOST
            - name: NEXT_PUBLIC_ADMIN_HOST
              valueFrom:
                configMapKeyRef:
                  name: id-frontend-config
                  key: ADMIN_HOST
            - name: NEXT_PUBLIC_EXERCISES_HOST
              valueFrom:
                configMapKeyRef:
                  name: id-frontend-config
                  key: EXERCISES_HOST
            - name: NEXT_PUBLIC_EVENT_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: id-frontend-config
                  key: EVENT_DOMAIN
            - name: NEXT_PUBLIC_PARTNER_URL
              valueFrom:
                configMapKeyRef:
                  name: id-frontend-config
                  key: PARTNER_URL
            - name: NEXT_PUBLIC_PARTNER_SITE_URL
              valueFrom:
                configMapKeyRef:
                  name: id-frontend-config
                  key: PARTNER_SITE_URL
            - name: NEXT_PUBLIC_GOOGLE_ANALYTICS_ID
              valueFrom:
                configMapKeyRef:
                  name: id-frontend-config
                  key: GOOGLE_ANALYTICS_ID
            - name: NEXT_PUBLIC_RECAPTCHA_SITE_KEY
              valueFrom:
                configMapKeyRef:
                  name: id-frontend-config
                  key: RECAPTCHA_SITE_KEY
            - name: NEXT_PUBLIC_RECAPTCHA_ENTERPRISE
              valueFrom:
                configMapKeyRef:
                  name: id-frontend-config
                  key: RECAPTCHA_ENTERPRISE
          ports:
            - containerPort: 3000
              protocol: TCP
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              port: 3000
              path: /healthz
            initialDelaySeconds: 20
          livenessProbe:
            httpGet:
              port: 3000
              path: /healthz
            initialDelaySeconds: 20
            periodSeconds: 30
