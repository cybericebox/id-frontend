apiVersion: apps/v1
kind: Deployment
metadata:
  name: id-frontend
  namespace: cybericebox
  labels:
    app: id-frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 3
      maxUnavailable: 0
  selector:
    matchLabels:
      app: id-frontend
  template:
    metadata:
      labels:
        app: id-frontend
    spec:
      containers:
        - name: id-frontend
          image: cybericebox/id-frontend:v0.1.0 # the release tag: an exact version, never latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NEXT_PUBLIC_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: id-frontend-config
                  key: DOMAIN
            - name: NEXT_PUBLIC_SUPPORT_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: id-frontend-config
                  key: SUPPORT_EMAIL
            - name: NEXT_PUBLIC_PARTNER_ICE_NURE_URL
              valueFrom:
                configMapKeyRef:
                  name: id-frontend-config
                  key: PARTNER_ICE_NURE_URL
            - name: NEXT_PUBLIC_PARTNER_NURE_URL
              valueFrom:
                configMapKeyRef:
                  name: id-frontend-config
                  key: PARTNER_NURE_URL
            - name: NEXT_PUBLIC_GOOGLE_ANALYTICS_ID
              valueFrom:
                configMapKeyRef:
                  name: id-frontend-config
                  key: GOOGLE_ANALYTICS_ID
            - name: NEXT_PUBLIC_CAPTCHA_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: id-frontend-config
                  key: CAPTCHA_PROVIDER
            - name: NEXT_PUBLIC_CAPTCHA_SITE_KEY
              valueFrom:
                configMapKeyRef:
                  name: id-frontend-config
                  key: CAPTCHA_SITE_KEY
            - name: NEXT_PUBLIC_RECAPTCHA_PROJECT
              valueFrom:
                configMapKeyRef:
                  name: id-frontend-config
                  key: RECAPTCHA_PROJECT
                  optional: true
          ports:
            - containerPort: 3000
              protocol: TCP
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              port: 3000
              path: /healthz
            initialDelaySeconds: 20
          livenessProbe:
            httpGet:
              port: 3000
              path: /healthz
            initialDelaySeconds: 20
            periodSeconds: 30
